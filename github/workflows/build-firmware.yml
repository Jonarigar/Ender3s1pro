name: Build Firmware
 
on:
  push:
    branches: ["**"]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install PlatformIO
        run: pip install platformio
 
      - name: Build firmware
        run: platformio run -e STM32F401RC_creality
 
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-Ender3S1-F4
          path: .pio/build/STM32F401RC_creality/*.bin
          retention-days: 30
