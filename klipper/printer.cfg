# ================================================================
# Klipper - Creality Ender 3 S1 Pro
# Placa: CR-FDM-v24S1_301 (STM32F401)
# Extrusor: Sprite (direct drive)
# Sensor: CR Touch
# Volumen: 220 x 220 x 270 mm
# ================================================================
#
# COMPILAR FIRMWARE (en Ubuntu/WSL2):
#   cd ~/klipper
#   make menuconfig
#     - Micro-controller:   STM32
#     - Processor model:    STM32F401
#     - Bootloader offset:  64KiB bootloader
#     - Communication:      USB (on PA11/PA12)
#   make
#
# FLASHEAR:
#   Renombra klipper.bin a firmware.bin
#   Crea carpeta STM32F4_UPDATE en la SD
#   Pon firmware.bin dentro de esa carpeta
#   Inserta SD en la impresora y enciende
# ================================================================

[mcu]
# Ejecuta: ls /dev/ttyUSB* /dev/ttyACM* para encontrar tu puerto
# Con WSL2 + usbipd suele ser /dev/ttyACM0
serial: /dev/ttyACM0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

# ──────────────────────────────────────────────
# EJE X
# ──────────────────────────────────────────────

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -10
position_max: 235
position_min: -10
homing_speed: 50

# ──────────────────────────────────────────────
# EJE Y
# ──────────────────────────────────────────────

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -2
position_max: 235
position_min: -2
homing_speed: 50

# ──────────────────────────────────────────────
# EJE Z (motor 1)
# ──────────────────────────────────────────────

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 270
position_min: -4
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 2.0

# ──────────────────────────────────────────────
# EJE Z (motor 2) — S1 Pro tiene doble Z
# ──────────────────────────────────────────────

[stepper_z1]
step_pin: PB0
dir_pin: PC5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8

# ──────────────────────────────────────────────
# EXTRUSOR SPRITE
# ──────────────────────────────────────────────

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.5        # Sprite extruder — calibrar con torre e-steps
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100.0
pressure_advance: 0.04        # Afinar con torre Pressure Advance

# Calibrar PID con: PID_CALIBRATE HEATER=extruder TARGET=200
control: pid
pid_kp: 28.0
pid_ki: 1.5
pid_kd: 130.0

# ──────────────────────────────────────────────
# CAMA CALIENTE
# ──────────────────────────────────────────────

[heater_bed]
heater_pin: PA15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

# Calibrar PID con: PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_kp: 67.0
pid_ki: 0.8
pid_kd: 1400.0

# ──────────────────────────────────────────────
# VENTILADORES
# ──────────────────────────────────────────────

[fan]
pin: PA0              # Ventilador de capa (part cooling)

[heater_fan hotend_fan]
pin: PC0              # Ventilador del hotend
heater: extruder
heater_temp: 50.0

# ──────────────────────────────────────────────
# CR TOUCH
# ──────────────────────────────────────────────

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -31.8
y_offset: -40.5
z_offset: 0           # Calibrar con: PROBE_CALIBRATE
speed: 10
samples: 2
samples_result: median
sample_retract_dist: 3.0
stow_on_each_sample: false
probe_with_touch_mode: true

[safe_z_home]
home_xy_position: 147, 154    # Centro cama corregido con offset CR Touch
speed: 75
z_hop: 10
z_hop_speed: 5

# ──────────────────────────────────────────────
# BED MESH (nivelación automática)
# ──────────────────────────────────────────────

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 185, 180
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

# ──────────────────────────────────────────────
# ALINEACIÓN DOBLE Z
# ──────────────────────────────────────────────

[z_tilt]
z_positions:
    -17, 110    # Posición tornillo Z izquierdo
    258, 110    # Posición tornillo Z derecho
points:
    30, 110
    200, 110
speed: 100
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.01

# ──────────────────────────────────────────────
# SENSOR FILAMENTO
# ──────────────────────────────────────────────

[filament_switch_sensor filament_sensor]
switch_pin: !PC15
pause_on_runout: true
runout_gcode: PAUSE

# ──────────────────────────────────────────────
# INPUT SHAPER (requiere ADXL345)
# ──────────────────────────────────────────────

#[adxl345]
#cs_pin: ...
#
#[resonance_tester]
#accel_chip: adxl345
#probe_points: 110, 110, 20
#
#[input_shaper]
#shaper_freq_x: 0      # Completar tras medir con SHAPER_CALIBRATE
#shaper_freq_y: 0
#shaper_type: mzv

# ──────────────────────────────────────────────
# MACROS
# ──────────────────────────────────────────────

[gcode_macro START_PRINT]
description: Inicio de impresión — usar en el slicer
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED}                    ; Precalentar cama
    M104 S{EXTRUDER}               ; Precalentar hotend
    G28                            ; Home
    Z_TILT_ADJUST                  ; Nivelar doble Z
    BED_MESH_CALIBRATE             ; Malla de nivelación
    G1 Z5 F3000
    M190 S{BED}                    ; Esperar cama
    M109 S{EXTRUDER}               ; Esperar hotend
    G92 E0
    G1 X5 Y20 Z0.3 F5000           ; Línea de purga
    G1 X5 Y200 E15 F1500
    G1 X5.4 Y200 F5000
    G1 X5.4 Y20 E30 F1500
    G92 E0

[gcode_macro END_PRINT]
description: Fin de impresión
gcode:
    G91
    G1 E-2 F2700                   ; Retracción
    G1 E-2 Z5 F2700
    G90
    G1 X5 Y220 F3000               ; Apartar cabezal
    M106 S0                        ; Apagar ventilador capa
    M104 S0                        ; Apagar hotend
    M140 S0                        ; Apagar cama
    M84                            ; Apagar motores

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-2 F2100
    G1 Z10 F600
    G90
    G1 X5 Y220 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E2 F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    END_PRINT
    BASE_CANCEL_PRINT

[gcode_macro G29]
description: Calibración bed mesh completa
gcode:
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    G1 X0 Y0 Z10 F6000

